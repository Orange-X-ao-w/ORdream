<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="ORDM术力口竞答 —— 入口跳转导航（主链接 / 备用链接）" />
<title>术力口竞答 · 入口跳转</title>
<style>
  :root{
    --bg:#08171c;
    --accent:#39c5bb;
    --yellow:#fff700;
    --text:#e9f7f6;
    --muted:#8fb1b0;
    --line:rgba(57,197,187,.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    padding:48px 20px 34px;
    color:var(--text);
    background:
      radial-gradient(900px 620px at 12% 8%, rgba(57,197,187,.18), transparent 62%),
      radial-gradient(760px 520px at 88% 92%, rgba(255,247,0,.10), transparent 62%),
      var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    -webkit-mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    pointer-events:none;
    z-index:0;
  }
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .floaters span{
    position:absolute;
    border-radius:10px;
    border:1px solid var(--line);
    background:linear-gradient(135deg, rgba(57,197,187,.20), rgba(57,197,187,.02));
    animation:drift 16s ease-in-out infinite;
  }
  .floaters span:nth-child(1){width:76px;height:76px;left:6%;top:16%;animation-duration:18s;}
  .floaters span:nth-child(2){width:44px;height:44px;left:88%;top:22%;animation-duration:14s;animation-delay:-4s;}
  .floaters span:nth-child(3){width:100px;height:100px;left:78%;bottom:12%;animation-duration:21s;animation-delay:-8s;}
  .floaters span:nth-child(4){width:34px;height:34px;left:14%;bottom:18%;animation-duration:12s;animation-delay:-2s;}
  .floaters span:nth-child(5){width:22px;height:22px;left:48%;top:8%;animation-duration:10s;animation-delay:-6s;background:linear-gradient(135deg, rgba(255,247,0,.35), rgba(255,247,0,.02));border-color:rgba(255,247,0,.3);}
  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(0deg);opacity:.55;}
    50%{transform:translateY(-22px) rotate(14deg);opacity:1;}
  }

  .card{
    position:relative;
    z-index:1;
    width:min(620px, 100%);
    padding:clamp(30px, 6vw, 50px) clamp(22px, 5vw, 44px) clamp(30px, 5vw, 42px);
    text-align:center;
    border:1px solid var(--line);
    border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    border-radius:999px;
    border:1px solid rgba(255,247,0,.35);
    background:rgba(255,247,0,.10);
    color:#ffef7a;
    font-size:13px;
    letter-spacing:.06em;
  }
  .tag::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--yellow);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,247,0,.55);}
    70%{box-shadow:0 0 0 10px rgba(255,247,0,0);}
    100%{box-shadow:0 0 0 0 rgba(255,247,0,0);}
  }

  h1{
    margin:20px 0 0;
    font-size:clamp(16px, 3.2vw, 20px);
    font-weight:500;
    letter-spacing:.32em;
    color:var(--muted);
    text-indent:.32em;
  }
  .name{
    margin:12px 0 0;
    font-size:clamp(30px, 8vw, 52px);
    font-weight:800;
    line-height:1.18;
    background:linear-gradient(120deg, #ffffff 8%, var(--accent) 48%, var(--yellow) 92%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
  }
  .desc{
    margin:18px auto 0;
    max-width:32em;
    font-size:clamp(14px, 2.6vw, 16px);
    line-height:1.9;
    color:#c3dedc;
  }

  /* 链接列表 */
  .links{
    margin-top:32px;
    display:grid;
    gap:14px;
    text-align:left;
  }
  .link{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    border-radius:16px;
    text-decoration:none;
    border:1px solid var(--line);
    background:rgba(255,255,255,.045);
    transition:transform .18s ease, border-color .2s ease, background .2s ease;
  }
  .link:hover{
    transform:translateY(-3px);
    border-color:rgba(57,197,187,.6);
    background:rgba(57,197,187,.12);
  }
  .link .ico{
    flex:0 0 40px;
    height:40px;
    border-radius:12px;
    display:grid;
    place-items:center;
    color:#04231f;
    background:linear-gradient(135deg, #4ad8cc, #23a89b);
  }
  .link.bak .ico{
    color:var(--accent);
    background:transparent;
    border:1px solid var(--line);
  }
  .link .ico svg{width:19px;height:19px;}
  .link .meta{min-width:0;flex:1;}
  .link .lb{font-size:16px;font-weight:800;color:var(--text);}
  .link .ur{
    margin-top:5px;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
    word-break:break-all;
  }
  .link .go{flex:0 0 auto;color:var(--accent);}
  .link .go svg{width:17px;height:17px;}

  .note{
    margin-top:22px;
    font-size:12.5px;
    line-height:1.8;
    color:#8fb1b0;
  }

  /* 次要按钮行 */
  .btn-row{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:26px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:12px 26px;
    border-radius:999px;
    font-size:14.5px;
    font-weight:700;
    text-decoration:none;
    color:var(--accent);
    border:1px solid var(--line);
    background:transparent;
    transition:transform .18s ease, border-color .2s ease, background .2s ease;
  }
  .btn:hover{
    transform:translateY(-2px);
    border-color:rgba(57,197,187,.65);
    background:rgba(57,197,187,.10);
  }
  .btn svg{width:15px;height:15px;}

  footer{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .icp{display:block;line-height:0;}
  .icp svg{display:block;}
  .copyright{font-size:12px;color:rgba(143,177,176,.75);}

  @media (max-width:430px){
    .btn{width:100%;justify-content:center;}
    .btn-row{flex-direction:column;align-items:stretch;gap:10px;}
    .link{padding:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

</body>
