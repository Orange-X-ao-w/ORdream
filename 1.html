<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORDM 术力口竞答</title>
<style>
  :root{
    --bg:#08171c; --accent:#39c5bb; --yellow:#fff700;
    --text:#e9f7f6; --muted:#8fb1b0; --line:rgba(57,197,187,.22);
    --ok:#39c5bb; --no:#ff5c7a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; padding:36px 18px 30px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text);
    background:
      radial-gradient(900px 620px at 12% 8%, rgba(57,197,187,.18), transparent 62%),
      radial-gradient(760px 520px at 88% 92%, rgba(255,247,0,.10), transparent 62%),
      var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    position:relative; overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    -webkit-mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    pointer-events:none;z-index:0;
  }
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .floaters span{
    position:absolute;border-radius:10px;border:1px solid var(--line);
    background:linear-gradient(135deg, rgba(57,197,187,.20), rgba(57,197,187,.02));
    animation:drift 16s ease-in-out infinite;
  }
  .floaters span:nth-child(1){width:76px;height:76px;left:5%;top:14%;animation-duration:18s;}
  .floaters span:nth-child(2){width:44px;height:44px;left:89%;top:20%;animation-duration:14s;animation-delay:-4s;}
  .floaters span:nth-child(3){width:100px;height:100px;left:80%;bottom:10%;animation-duration:21s;animation-delay:-8s;}
  .floaters span:nth-child(4){width:34px;height:34px;left:12%;bottom:16%;animation-duration:12s;animation-delay:-2s;}
  .floaters span:nth-child(5){width:22px;height:22px;left:50%;top:6%;animation-duration:10s;animation-delay:-6s;background:linear-gradient(135deg, rgba(255,247,0,.35), rgba(255,247,0,.02));border-color:rgba(255,247,0,.3);}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(0deg);opacity:.55;}50%{transform:translateY(-22px) rotate(14deg);opacity:1;}}

  .wrap{position:relative;z-index:1;width:min(700px,100%);}
  .card{
    padding:clamp(26px,5vw,42px) clamp(20px,4.5vw,40px) clamp(28px,4.5vw,38px);
    border:1px solid var(--line);border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

  .tag{
    display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;
    border:1px solid rgba(255,247,0,.35);background:rgba(255,247,0,.10);
    color:#ffef7a;font-size:13px;letter-spacing:.06em;
  }
  .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,247,0,.55);}70%{box-shadow:0 0 0 10px rgba(255,247,0,0);}100%{box-shadow:0 0 0 0 rgba(255,247,0,0);}}

  .title{
    margin:16px 0 0;font-size:clamp(28px,7vw,44px);font-weight:800;line-height:1.18;
    background:linear-gradient(120deg,#fff 8%, var(--accent) 48%, var(--yellow) 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  }
  .sub{margin:12px 0 0;font-size:14.5px;color:#c3dedc;line-height:1.85;}

  /* 难度选择 */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px;}
  .mode{
    text-align:left;padding:22px 20px;border-radius:18px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.045);
    color:var(--text);font-family:inherit;
    transition:transform .18s ease, border-color .2s ease, background .2s ease;
  }
  .mode:hover{transform:translateY(-4px);border-color:rgba(57,197,187,.6);background:rgba(57,197,187,.10);}
  .mode .lv{font-size:12px;color:var(--yellow);letter-spacing:.14em;font-weight:700;}
  .mode .nm{margin-top:8px;font-size:20px;font-weight:800;}
  .mode .ds{margin-top:8px;font-size:13px;line-height:1.7;color:#a9cdcb;}
  .mode .mt{margin-top:12px;font-size:12px;color:var(--accent);}
  @media (max-width:520px){.modes{grid-template-columns:1fr;}}

  /* 状态条 */
  .status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;font-size:13.5px;color:var(--muted);}
  .progress{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:0 4px;}
  .progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#4ad8cc,var(--yellow));transition:width .35s ease;}

  .qhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap;}
  .qno{font-size:13px;color:var(--accent);letter-spacing:.1em;font-weight:700;}
  .qcat{font-size:12px;color:#7f9e9d;border:1px solid var(--line);border-radius:999px;padding:2px 10px;}
  .qmode{font-size:12px;color:#ffef7a;border:1px solid rgba(255,247,0,.3);border-radius:999px;padding:2px 10px;background:rgba(255,247,0,.06);}
  .qtext{margin:0 0 20px;font-size:clamp(16px,3.4vw,20px);font-weight:700;line-height:1.7;color:#f2fffe;}

  .opts{display:grid;gap:11px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    padding:14px 16px;border-radius:14px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.045);
    color:var(--text);font-size:15px;line-height:1.55;font-family:inherit;
    transition:transform .15s ease, border-color .2s ease, background .2s ease;
  }
  .opt:hover:not(:disabled){transform:translateX(4px);border-color:rgba(57,197,187,.55);background:rgba(57,197,187,.10);}
  .opt:disabled{cursor:default;}
  .opt .key{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(57,197,187,.16);color:var(--accent);font-weight:800;font-size:13px;}
  .opt.correct{border-color:rgba(57,197,187,.85);background:rgba(57,197,187,.18);}
  .opt.correct .key{background:var(--ok);color:#04231f;}
  .opt.wrong{border-color:rgba(255,92,122,.8);background:rgba(255,92,122,.14);}
  .opt.wrong .key{background:var(--no);color:#fff;}
  .opt.dim{opacity:.42;}

  .explain{margin-top:16px;padding:13px 15px;border-radius:14px;display:none;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13.5px;line-height:1.8;color:#c9e6e4;}
  .explain.show{display:block;animation:rise .35s ease both;}
  .explain b{color:var(--yellow);}

  .btn{
    display:inline-flex;align-items:center;gap:9px;margin-top:22px;
    padding:14px 32px;border-radius:999px;border:none;cursor:pointer;
    font-size:16px;font-weight:700;font-family:inherit;color:#04231f;
    background:linear-gradient(135deg,#4ad8cc,#23a89b);
    box-shadow:0 12px 32px rgba(57,197,187,.34);
    transition:transform .18s ease, box-shadow .22s ease;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(57,197,187,.5);}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);box-shadow:none;margin-left:10px;}
  .btn.ghost:hover{border-color:rgba(57,197,187,.6);background:rgba(57,197,187,.08);}

  .score{margin:20px 0 0;font-size:clamp(50px,13vw,80px);font-weight:900;line-height:1;
    background:linear-gradient(120deg,#fff,var(--accent) 45%,var(--yellow));
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
  .score small{font-size:.3em;font-weight:700;}
  .rank{display:inline-block;margin-top:12px;padding:9px 22px;border-radius:999px;font-weight:800;font-size:17px;border:1px solid rgba(255,247,0,.4);background:rgba(255,247,0,.12);color:#ffef7a;}
  .comment{margin:14px 0 0;font-size:15px;line-height:1.85;color:#c3dedc;}
  .stat{margin-top:16px;display:flex;justify-content:center;gap:26px;font-size:13px;color:var(--muted);}
  .stat b{display:block;font-size:20px;color:var(--text);font-weight:800;}
  .review{margin-top:20px;text-align:left;display:grid;gap:8px;max-height:300px;overflow-y:auto;padding-right:6px;}
  .review::-webkit-scrollbar{width:6px;}
  .review::-webkit-scrollbar-thumb{background:rgba(57,197,187,.35);border-radius:99px;}
  .ritem{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.6;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);}
  .ritem .mark{flex:0 0 18px;font-weight:900;text-align:center;}
  .ritem.ok .mark{color:var(--ok);}
  .ritem.no .mark{color:var(--no);}
  .ritem .rt{color:#b9d8d6;}

  footer{position:relative;z-index:1;margin-top:20px;text-align:center;font-size:12px;color:rgba(143,177,176,.7);line-height:1.8;}
  .hidden{display:none !important;}
  @media (max-width:430px){
    .btn{width:100%;justify-content:center;margin-left:0 !important;}
    .btn.ghost{margin-top:10px;}
    .status{font-size:12px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<div class="floaters" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

<div class="wrap">
  <!-- 难度选择 -->
  <section class="card" id="homePage">
    <div class="tag">VOCALOID QUIZ</div>
    <h1 class="title">ORDM 术力口竞答</h1>
    <p class="sub">两种难度，任选其一。题目涵盖日术、中术、英术以及各类歌声合成软件的历史。</p>
    <div class="modes">
      <button class="mode" type="button" data-mode="easy">
        <div class="lv">LEVEL 1</div>
        <div class="nm">小萌新</div>
        <div class="ds">知名歌姬（初音未来、镜音双子、巡音流歌等）与大 P 主的代表名曲。</div>
        <div class="mt">题库 100 题 · 随机 15 题 · 满分 100</div>
      </button>
      <button class="mode" type="button" data-mode="hard">
        <div class="lv">LEVEL 2</div>
        <div class="nm">老资历</div>
        <div class="ds">小 P 主、大 P 老歌、冷门歌姬与声库、软件沿革，以及中术 / 英术 / 日术通史。</div>
        <div class="mt">题库 1000 题 · 共 105 题（含 5 道小萌新题）</div>
      </button>
    </div>
    <p class="sub" style="margin-top:22px;font-size:13px;color:#8fb1b0;">
      提示：老资历模式题量较大，中途退出进度不保存。
    </p>
  </section>

  <!-- 答题 -->
  <section class="card hidden" id="quizPage">
    <div class="status">
      <span id="qCount">第 1 / 15 题</span>
      <div class="progress"><i id="qBar"></i></div>
      <span id="qScore">答对 0</span>
    </div>
    <div class="qhead">
      <span class="qno" id="qNo">Q1</span>
      <span class="qmode" id="qMode">小萌新</span>
      <span class="qcat" id="qCat">曲目</span>
    </div>
    <h2 class="qtext" id="qText"></h2>
    <div class="opts" id="opts"></div>
    <div class="explain" id="explain"></div>
    <button class="btn hidden" id="nextBtn" type="button">下一题</button>
  </section>

  <!-- 结果 -->
  <section class="card hidden" id="resultPage" style="text-align:center;">
    <div class="tag">RESULT</div>
    <div class="score"><span id="finalScore">0</span><small> / 100</small></div>
    <div class="rank" id="rankText">—</div>
    <p class="comment" id="commentText"></p>
    <div class="stat">
      <div>答对<b id="sOk">0</b></div>
      <div>答错<b id="sNo">0</b></div>
      <div>正确率<b id="sRate">0%</b></div>
    </div>
    <div class="review" id="review"></div>
    <button class="btn" id="againBtn" type="button">再来一次</button>
    <button class="btn ghost" id="backBtn" type="button">换个难度</button>
  </section>

  <footer>© ORDM 术力口 · 小萌新 15 题 / 老资历 105 题 · 满分 100 分</footer>
</div>

const MODES = {
  easy: { name:'小萌新', total:15 },
  hard: { name:'老资历', total:105 }
};

const homePage  = document.getElementById('homePage');
const quizPage  = document.getElementById('quizPage');
const resultPage= document.getElementById('resultPage');
const qCount=document.getElementById('qCount'), qBar=document.getElementById('qBar'),
      qScore=document.getElementById('qScore'), qNo=document.getElementById('qNo'),
      qMode=document.getElementById('qMode'), qCat=document.getElementById('qCat'),
      qText=document.getElementById('qText'), optsEl=document.getElementById('opts'),
      explainEl=document.getElementById('explain'), nextBtn=document.getElementById('nextBtn');

let mode='easy', list=[], idx=0, right=0, locked=false, recs=[];

function shuffle(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function start(m){
  mode=m; idx=0; right=0; locked=false; recs=[];
  if(m==='easy'){
    list = shuffle(BANK_A).slice(0, MODES.easy.total);
  }else{
    const easyPart = shuffle(BANK_A).slice(0,5);
    const hardPart = shuffle(BANK_B).slice(0,100);
    list = shuffle(easyPart.concat(hardPart));
  }
  homePage.classList.add('hidden');
  resultPage.classList.add('hidden');
  quizPage.classList.remove('hidden');
  render();
}

function render(){
  locked=false;
  explainEl.classList.remove('show'); explainEl.innerHTML='';
  nextBtn.classList.add('hidden');
  const q=list[idx], total=list.length;
  qNo.textContent='Q'+(idx+1);
  qMode.textContent=MODES[mode].name;
  qCat.textContent=q.c||'综合';
  qText.textContent=q.q;
  qCount.textContent='第 '+(idx+1)+' / '+total+' 题';
  qScore.textContent='答对 '+right;
  qBar.style.width=(idx/total*100)+'%';

  const keys=['A','B','C','D'];
  const pairs=q.o.map((t,i)=>({t,ok:i===q.a}));
  const mixed=shuffle(pairs);
  const ans=mixed.findIndex(p=>p.ok);
  optsEl.innerHTML='';
  mixed.forEach((p,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='opt';
    b.innerHTML='<span class="key">'+keys[i]+'</span><span class="txt"></span>';
    b.querySelector('.txt').textContent=p.t;
    b.addEventListener('click',()=>choose(b,i,ans,q));
    optsEl.appendChild(b);
  });
}

function choose(btn,picked,ans,q){
  if(locked) return;
  locked=true;
  const all=optsEl.querySelectorAll('.opt');
  all.forEach(b=>b.disabled=true);
  const ok=picked===ans;
  if(ok){ btn.classList.add('correct'); right++; qScore.textContent='答对 '+right; }
  else{
    btn.classList.add('wrong');
    all[ans].classList.add('correct');
    all.forEach((b,i)=>{ if(i!==picked&&i!==ans) b.classList.add('dim'); });
  }
  recs.push({q:q.q, ok, ans:q.o[q.a], e:q.e||''});
  explainEl.innerHTML=(ok?'✅ 答对了！':'❌ 答错了，正确答案：<b>'+esc(q.o[q.a])+'</b>')+
    (q.e?'<br>'+q.e:'');
  explainEl.classList.add('show');
  nextBtn.textContent=(idx===list.length-1)?'查看结果':'下一题';
  nextBtn.classList.remove('hidden');
}

function next(){ if(idx<list.length-1){ idx++; render(); } else finish(); }

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function finish(){
  quizPage.classList.add('hidden');
  resultPage.classList.remove('hidden');
  qBar.style.width='100%';
  const total=list.length, ok=recs.filter(r=>r.ok).length;
  const sc=Math.round(ok/total*100);
  document.getElementById('finalScore').textContent=sc;
  document.getElementById('sOk').textContent=ok;
  document.getElementById('sNo').textContent=total-ok;
  document.getElementById('sRate').textContent=sc+'%';

  let rank,cm;
  if(mode==='easy'){
    if(sc===100){rank='术力口之神';cm='满分！你对知名歌姬和大 P 主了如指掌，可以挑战老资历了。';}
    else if(sc>=80){rank='资深葱粉';cm='基础非常扎实，再来一次就能冲满分。';}
    else if(sc>=60){rank='合格葱民';cm='大方向没问题，把错题看一遍就能涨分。';}
    else if(sc>=40){rank='见习术力口';cm='多听几首名曲、认认 P 主，提升会很快。';}
    else {rank='萌新入坑';cm='别灰心，从初音未来的代表曲开始补番吧 ✨';}
  }else{
    if(sc>=90){rank='术力口活字典';cm='这是真正的老资历。冷门 P 主和软件沿革都难不倒你。';}
    else if(sc>=75){rank='骨灰级葱粉';cm='功底深厚，只剩少量偏门题没拿下。';}
    else if(sc>=60){rank='资深术力口';cm='相当不错，105 题能到这个分已经超过大多数人。';}
    else if(sc>=45){rank='进阶葱民';cm='主流没问题，冷门知识还有提升空间。';}
    else if(sc>=30){rank='普通术力口';cm='老资历题库确实硬核，先补补软件史和小众 P 主。';}
    else {rank='误入老资历';cm='这题库是地狱难度，建议先从小萌新模式起步 🎤';}
  }
  document.getElementById('rankText').textContent=rank;
  document.getElementById('commentText').textContent=MODES[mode].name+'模式 · 答对 '+ok+' / '+total+' 题。'+cm;

  const rv=document.getElementById('review'); rv.innerHTML='';
  recs.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='ritem '+(r.ok?'ok':'no');
    d.innerHTML='<span class="mark">'+(r.ok?'✓':'✕')+'</span><span class="rt"><b>Q'+(i+1)+'</b> '+esc(r.q)+
      (r.ok?'':'　→ 正确：<b>'+esc(r.ans)+'</b>')+'</span>';
    rv.appendChild(d);
  });
}

document.querySelectorAll('.mode').forEach(b=>{
  b.addEventListener('click',()=>start(b.dataset.mode));
});
nextBtn.addEventListener('click',next);
document.getElementById('againBtn').addEventListener('click',()=>start(mode));
document.getElementById('backBtn').addEventListener('click',()=>{
  resultPage.classList.add('hidden'); homePage.classList.remove('hidden');
});
</script>
