<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="ORDM术力口 —— 网站正在装修中，欢迎前往主站。" />
<title>欢迎光临 ORDM术力口</title>
<style>
  :root{
    --bg:#08171c;
    --accent:#39c5bb;
    --yellow:#fff700;
    --text:#e9f7f6;
    --muted:#8fb1b0;
    --card:rgba(255,255,255,.045);
    --line:rgba(57,197,187,.22);
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    padding:48px 20px 36px;
    color:var(--text);
    background:
      radial-gradient(900px 620px at 12% 8%, rgba(57,197,187,.18), transparent 62%),
      radial-gradient(760px 520px at 88% 92%, rgba(255,247,0,.10), transparent 62%),
      var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    position:relative;
    overflow-x:hidden;
  }

  /* 背景网格 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    -webkit-mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    pointer-events:none;
    z-index:0;
  }

  /* 漂浮装饰方块 */
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .floaters span{
    position:absolute;
    border-radius:10px;
    border:1px solid var(--line);
    background:linear-gradient(135deg, rgba(57,197,187,.20), rgba(57,197,187,.02));
    animation:drift 16s ease-in-out infinite;
  }
  .floaters span:nth-child(1){width:76px;height:76px;left:6%;top:16%;animation-duration:18s;}
  .floaters span:nth-child(2){width:44px;height:44px;left:88%;top:22%;animation-duration:14s;animation-delay:-4s;}
  .floaters span:nth-child(3){width:100px;height:100px;left:78%;bottom:12%;animation-duration:21s;animation-delay:-8s;}
  .floaters span:nth-child(4){width:34px;height:34px;left:14%;bottom:18%;animation-duration:12s;animation-delay:-2s;}
  .floaters span:nth-child(5){width:22px;height:22px;left:48%;top:8%;animation-duration:10s;animation-delay:-6s;background:linear-gradient(135deg, rgba(255,247,0,.35), rgba(255,247,0,.02));border-color:rgba(255,247,0,.3);}

  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(0deg);opacity:.55;}
    50%{transform:translateY(-22px) rotate(14deg);opacity:1;}
  }

  /* 主卡片 */
  .card{
    position:relative;
    z-index:1;
    width:min(660px, 100%);
    padding:clamp(30px, 6vw, 54px) clamp(22px, 5vw, 46px) clamp(32px, 5vw, 44px);
    text-align:center;
    border:1px solid var(--line);
    border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:none;}
  }

  /* 装修中标签 */
  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    border-radius:999px;
    border:1px solid rgba(255,247,0,.35);
    background:rgba(255,247,0,.10);
    color:#ffef7a;
    font-size:13px;
    letter-spacing:.06em;
  }
  .tag::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 0 0 rgba(255,247,0,.6);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,247,0,.55);}
    70%{box-shadow:0 0 0 10px rgba(255,247,0,0);}
    100%{box-shadow:0 0 0 0 rgba(255,247,0,0);}
  }

  h1{
    margin:22px 0 0;
    font-size:clamp(17px, 3.4vw, 21px);
    font-weight:500;
    letter-spacing:.34em;
    color:var(--muted);
    text-indent:.34em;
  }

  .name{
    margin:12px 0 0;
    font-size:clamp(34px, 9vw, 60px);
    font-weight:800;
    line-height:1.15;
    background:linear-gradient(120deg, #ffffff 8%, var(--accent) 48%, var(--yellow) 92%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
  }

  .desc{
    margin:20px auto 0;
    max-width:30em;
    font-size:clamp(15px, 2.6vw, 17px);
    line-height:1.9;
    color:#c3dedc;
  }

  /* 主站按钮 */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:32px;
    padding:15px 40px;
    border-radius:999px;
    font-size:17px;
    font-weight:700;
    text-decoration:none;
    color:#04231f;
    background:linear-gradient(135deg, #4ad8cc, #23a89b);
    box-shadow:0 12px 32px rgba(57,197,187,.34);
    transition:transform .18s ease, box-shadow .22s ease, filter .18s ease;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(57,197,187,.5);filter:brightness(1.05);}
  .btn:active{transform:translateY(-1px);}
  .btn svg{width:17px;height:17px;}

  /* 施工进度条 */
  .bar{
    margin:34px auto 0;
    width:min(340px, 100%);
    height:8px;
    border-radius:999px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
    position:relative;
  }
  .bar::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:999px;
    background:repeating-linear-gradient(45deg, rgba(57,197,187,.95) 0 12px, rgba(57,197,187,.45) 12px 24px);
    background-size:34px 34px;
    animation:move 1.1s linear infinite;
  }
  @keyframes move{
    from{background-position:0 0;}
    to{background-position:34px 0;}
  }
  .bar-text{
    margin-top:12px;
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.12em;
  }

  /* 背景音乐按钮 */
  .music-btn{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:9;
    width:52px;
    height:52px;
    display:grid;
    place-items:center;
    padding:0;
    border:1px solid var(--line);
    border-radius:50%;
    cursor:pointer;
    color:var(--accent);
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
    transition:transform .18s ease, border-color .2s ease, color .2s ease;
  }
  .music-btn:hover{transform:scale(1.07);border-color:rgba(57,197,187,.55);}
  .music-btn:active{transform:scale(.96);}
  .music-btn svg{width:24px;height:24px;}

  /* 播放时唱片旋转 */
  .music-btn.playing .disc{animation:spin 3.2s linear infinite;}
  .music-btn.playing{
    color:#04231f;
    border-color:transparent;
    background:linear-gradient(135deg, #4ad8cc, #23a89b);
    box-shadow:0 10px 30px rgba(57,197,187,.42);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 暂停时隐藏音符上的斜杠 */
  .music-btn .slash{display:block;}
  .music-btn.playing .slash{display:none;}

  /* 播放时的声波条 */
  .waves{display:none;}
  .music-btn.playing .waves{display:block;position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(57,197,187,.45);animation:ripple 2s ease-out infinite;}
  .music-btn.playing .waves:nth-of-type(2){animation-delay:.7s;}
  @keyframes ripple{
    0%{transform:scale(1);opacity:.7;}
    100%{transform:scale(1.45);opacity:0;}
  }

  /* 首次点击提示 */
  .music-tip{
    position:fixed;
    right:84px;
    bottom:36px;
    z-index:9;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(8,23,28,.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#c3dedc;
    font-size:12.5px;
    white-space:nowrap;
    opacity:0;
    transform:translateX(8px);
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .music-tip.show{opacity:1;transform:none;}

  @media (max-width:420px){
    .music-tip{right:auto;left:20px;bottom:86px;}
  }

  /* 页脚 */
  footer{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .icp{display:block;line-height:0;}
  .icp svg{display:block;}
  .copyright{font-size:12px;color:rgba(143,177,176,.75);}

  @media (max-width:420px){
    .btn{width:100%;justify-content:center;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

  <div class="floaters" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="card">
    <div class="tag">正在装修中</div>

    <h1>欢迎光临</h1>
    <div class="name">ORDM术力口</div>

    <p class="desc">网站正在装修中，请去我的主站看看吧～</p>

    <a class="btn" href="https://orange-6lw.pages.dev" target="_blank" rel="noopener noreferrer">
      主站
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7M9 7h8v8"/>
      </svg>
    </a>

    <div class="bar" role="progressbar" aria-label="装修进度"></div>
    <div class="bar-text">CONSTRUCTION IN PROGRESS</div>
  </main>

  <!-- 背景音乐：请将 mp3 与本文件放在同一目录 -->
  <audio id="bgm" src="月が綺麗ねと言われたい！-柿崎ユウ_.mp3" loop preload="auto"></audio>

  <button class="music-btn" id="musicBtn" type="button" aria-label="播放/暂停背景音乐" title="播放/暂停背景音乐">
    <span class="waves"></span>
    <span class="waves"></span>
    <svg class="disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l10-3v12"/>
      <circle cx="6.5" cy="18" r="2.6"/>
      <circle cx="16.5" cy="15" r="2.6"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
  </button>
  <div class="music-tip" id="musicTip">点击页面任意处即可播放音乐 ♪</div>

  <footer>
    <span class="icp">
      <?xml version="1.0" encoding="UTF-8"?>
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="158.5" height="25" role="img" aria-label="萌ICP备: 20260696号">
        <a xlink:href="https://icp.gov.moe/?keyword=20260696" href="https://icp.gov.moe/?keyword=20260696" target="_blank">
        <title>萌ICP备: 20260696号</title>
    <defs>
        <clipPath id="rounded-corner">
            <rect width="158.5" height="25" rx="3" ry="3"/>
        </clipPath>
    </defs>
    <g shape-rendering="crispEdges" clip-path="url(#rounded-corner)">
        <rect width="65.5" height="25" fill="#fff700"/>
        <rect x="65.5" width="93" height="25" fill="#39c5bb"/>
    </g>
    <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="130">
        <text x="327.5" y="170" transform="scale(.1)" fill="#fff" textLength="505">萌ICP备</text>
        <text x="1120" y="170" transform="scale(.1)" fill="#fff" textLength="805">20260696号</text>
    </g>
        </a>
    </svg>
    </span>
    <div class="copyright">© ORDM术力口 Zcloud提供支持</div>
  </footer>

<script>
(function () {
  var audio    = document.getElementById('bgm');
  var btn      = document.getElementById('musicBtn');
  var tip      = document.getElementById('musicTip');
  var started  = false;   // 音乐是否已成功启动过
  var tipTimer = null;

  function syncUI() {
    btn.classList.toggle('playing', !audio.paused && !audio.ended);
  }

  function showTip(text, autoHide) {
    tip.textContent = text;
    tip.classList.add('show');
    clearTimeout(tipTimer);
    if (autoHide !== false) {
      tipTimer = setTimeout(function () { tip.classList.remove('show'); }, 3200);
    }
  }

  function tryPlay() {
    audio.volume = 0.6;
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.then(function () {
        started = true;
        syncUI();
        tip.classList.remove('show');
        removeOnce();
      }).catch(function () {
        // 浏览器拦截了自动播放，等用户首次交互再启动
        showTip('点击页面任意处即可播放音乐 ♪');
      });
    } else {
      started = true;
      syncUI();
      removeOnce();
    }
  }

  // 首次交互后自动开始播放
  function onFirstInteract() {
    if (started) return;
    tryPlay();
  }
  function removeOnce() {
    document.removeEventListener('click', onFirstInteract);
    document.removeEventListener('touchstart', onFirstInteract);
    document.removeEventListener('keydown', onFirstInteract);
  }
  document.addEventListener('click', onFirstInteract);
  document.addEventListener('touchstart', onFirstInteract);
  document.addEventListener('keydown', onFirstInteract);

  // 按钮：手动切换播放/暂停
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio.paused) {
      audio.volume = 0.6;
      audio.play().then(function () {
        started = true;
        syncUI();
        removeOnce();
        tip.classList.remove('show');
      }).catch(function () {
        showTip('音乐文件未找到，请确认 mp3 与网页在同一目录');
      });
    } else {
      audio.pause();
      syncUI();
      showTip('已暂停 ♪');
    }
  });

  // 自动播放被拦截时，鼠标移到按钮上就提示
  btn.addEventListener('mouseenter', function () {
    if (!started) showTip('点击开启背景音乐 ♪');
  });

  // 音频加载失败（文件名不对 / 文件缺失）时给出提示
  audio.addEventListener('error', function () {
    showTip('未找到音乐文件：请确认 mp3 与本网页在同一目录');
  });

  audio.addEventListener('play', syncUI);
  audio.addEventListener('pause', syncUI);

  // 页面加载后尝试自动播放（多数浏览器会拦截，交给上面的首次交互兜底）
  window.addEventListener('load', tryPlay);
})();
</script>

</body>
</html>
