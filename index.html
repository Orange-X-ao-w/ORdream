<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="ORDM术力口 —— 网站正在装修中，欢迎前往主站。" />
<title>欢迎光临 ORDM术力口</title>

<!-- 域名统一：非 ordm.de5.net 访问时跳转至主域名（切换旧版时例外） -->
<script>
(function () {
  try {
    var stay = /[?&]stay=1/.test(location.search) || sessionStorage.getItem('ordm_stay') === '1';
    if (!stay && location.hostname !== 'ordm.de5.net') {
      location.replace('https://ordm.de5.net/');
    }
  } catch (e) {}
})();
</script>

<style>
  :root{
    --bg:#ffffff;
    --ink:#111111;
    --text:#1f2328;
    --muted:#6b7280;
    --line:#e5e7eb;
    --soft:#f5f5f7;
    --accent:#111111;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    padding:64px 20px 36px;
    color:var(--text);
    background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    position:relative;
    overflow-x:hidden;
  }

  /* 背景网格（浅色） */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    -webkit-mask-image:radial-gradient(70% 60% at 50% 45%, #000 40%, transparent 100%);
    pointer-events:none;
    z-index:0;
  }

  /* 漂浮装饰方块（浅色） */
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .floaters span{
    position:absolute;
    border-radius:10px;
    border:1px solid var(--line);
    background:linear-gradient(135deg, rgba(0,0,0,.05), rgba(0,0,0,.01));
    animation:drift 16s ease-in-out infinite;
  }
  .floaters span:nth-child(1){width:76px;height:76px;left:6%;top:16%;animation-duration:18s;}
  .floaters span:nth-child(2){width:44px;height:44px;left:88%;top:22%;animation-duration:14s;animation-delay:-4s;}
  .floaters span:nth-child(3){width:100px;height:100px;left:78%;bottom:12%;animation-duration:21s;animation-delay:-8s;}
  .floaters span:nth-child(4){width:34px;height:34px;left:14%;bottom:18%;animation-duration:12s;animation-delay:-2s;}
  .floaters span:nth-child(5){width:22px;height:22px;left:48%;top:8%;animation-duration:10s;animation-delay:-6s;}

  @keyframes drift{
    0%,100%{transform:translateY(0) rotate(0deg);opacity:.5;}
    50%{transform:translateY(-22px) rotate(14deg);opacity:1;}
  }

  /* 主卡片 */
  .card{
    position:relative;
    z-index:1;
    width:min(660px, 100%);
    padding:clamp(30px, 6vw, 54px) clamp(22px, 5vw, 46px) clamp(32px, 5vw, 44px);
    text-align:center;
    border:1px solid var(--line);
    border-radius:24px;
    background:#ffffff;
    box-shadow:0 18px 50px rgba(0,0,0,.07);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

  /* 装修中标签 */
  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--soft);
    color:var(--muted);
    font-size:13px;
    letter-spacing:.06em;
  }
  .tag::before{
    content:"";
    width:8px;height:8px;border-radius:50%;
    background:var(--ink);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(17,17,17,.28);}
    70%{box-shadow:0 0 0 10px rgba(17,17,17,0);}
    100%{box-shadow:0 0 0 0 rgba(17,17,17,0);}
  }

  h1{
    margin:22px 0 0;
    font-size:clamp(17px, 3.4vw, 21px);
    font-weight:500;
    letter-spacing:.34em;
    color:var(--muted);
    text-indent:.34em;
  }

  .name{
    margin:12px 0 0;
    font-size:clamp(34px, 9vw, 60px);
    font-weight:800;
    line-height:1.15;
    background:linear-gradient(120deg, #111111 8%, #4b5563 50%, #9ca3af 92%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
  }

  .desc{
    margin:20px auto 0;
    max-width:30em;
    font-size:clamp(15px, 2.6vw, 17px);
    line-height:1.9;
    color:#4b5563;
  }

  /* 按钮行：主站 + 术力口竞答 */
  .btn-row{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    margin-top:32px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 40px;
    border-radius:999px;
    font-size:17px;
    font-weight:700;
    text-decoration:none;
    color:#ffffff;
    background:var(--ink);
    box-shadow:0 10px 26px rgba(0,0,0,.16);
    transition:transform .18s ease, box-shadow .22s ease, background .18s ease;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,.22);background:#000;}
  .btn:active{transform:translateY(-1px);}
  .btn svg{width:17px;height:17px;}

  .btn.ghost{
    color:var(--ink);
    background:#ffffff;
    border:1px solid var(--line);
    box-shadow:none;
  }
  .btn.ghost:hover{
    background:var(--soft);
    border-color:#d1d5db;
    box-shadow:0 10px 24px rgba(0,0,0,.08);
  }

  /* 施工进度条 */
  .bar{
    margin:34px auto 0;
    width:min(340px, 100%);
    height:8px;
    border-radius:999px;
    background:var(--soft);
    overflow:hidden;
    position:relative;
  }
  .bar::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:999px;
    background:repeating-linear-gradient(45deg, rgba(17,17,17,.85) 0 12px, rgba(17,17,17,.35) 12px 24px);
    background-size:34px 34px;
    animation:move 1.1s linear infinite;
  }
  @keyframes move{
    from{background-position:0 0;}
    to{background-position:34px 0;}
  }
  .bar-text{
    margin-top:12px;
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.12em;
  }

  /* ===== 悬浮按钮通用（右上角切换 / 右下角音乐） ===== */
  .float-btn{
    position:fixed;
    z-index:9;
    width:52px;
    height:52px;
    display:grid;
    place-items:center;
    padding:0;
    border:1px solid var(--line);
    border-radius:50%;
    cursor:pointer;
    color:var(--ink);
    background:#ffffff;
    box-shadow:0 8px 24px rgba(0,0,0,.10);
    transition:transform .18s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
  }
  .float-btn:hover{transform:scale(1.07);box-shadow:0 12px 30px rgba(0,0,0,.16);}
  .float-btn:active{transform:scale(.95);}
  .float-btn svg{width:23px;height:23px;}

  /* 右上角：切换新旧版 */
  .switch-btn{right:22px;top:22px;}

  /* 右下角：背景音乐 */
  .music-btn{right:22px;bottom:22px;}

  .music-btn.playing{
    color:#ffffff;
    background:var(--ink);
    border-color:var(--ink);
    box-shadow:0 10px 28px rgba(0,0,0,.26);
  }
  .music-btn.playing .disc{animation:spin 3.2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .music-btn .slash{display:block;}
  .music-btn.playing .slash{display:none;}

  .music-btn .waves{display:none;}
  .music-btn.playing .waves{
    display:block;
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1px solid rgba(17,17,17,.35);
    animation:ripple 2s ease-out infinite;
  }
  .music-btn.playing .waves:nth-of-type(2){animation-delay:.7s;}
  @keyframes ripple{
    0%{transform:scale(1);opacity:.6;}
    100%{transform:scale(1.45);opacity:0;}
  }

  /* 悬浮提示气泡 */
  .tip{
    position:fixed;
    z-index:9;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#ffffff;
    box-shadow:0 6px 18px rgba(0,0,0,.10);
    color:#4b5563;
    font-size:12.5px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .tip.show{opacity:1;}

  /* 音乐提示：按钮左侧 */
  .music-tip{right:84px;bottom:36px;transform:translateX(8px);}
  .music-tip.show{transform:none;}

  /* 切换提示：按钮下方 */
  .switch-tip{right:22px;top:82px;transform:translateY(-8px);}
  .switch-tip.show{transform:none;}

  /* 页脚 */
  footer{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .icp{display:block;line-height:0;}
  .icp svg{display:block;}
  .copyright{font-size:12px;color:rgba(107,114,128,.9);}

  @media (max-width:430px){
    .btn{width:100%;justify-content:center;}
    .btn-row{flex-direction:column;gap:12px;align-items:stretch;}
    .music-tip{right:auto;left:20px;bottom:86px;transform:translateY(8px);}
    .switch-tip{right:22px;left:auto;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

  <div class="floaters" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- 右上角：切换新版 / 旧版 -->
  <button class="float-btn switch-btn" id="switchBtn" type="button" aria-label="切换新版或旧版" title="切换新版 / 旧版">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <main class="card">

    <div class="btn-row">
      <a class="btn" href="https://orange-6lw.pages.dev" target="_blank" rel="noopener noreferrer">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <a class="btn ghost" href="quiz.html" target="_blank" rel="noopener noreferrer">

  <!-- 背景音乐：请将 mp3 与本文件放在同一目录 -->

<script>
/* ================= 新版 / 旧版 切换 ================= */
(function () {
  var NEW_URL = 'https://ordm.de5.net/';
  var OLD_URL = 'https://ordream.pages.dev/';
  var btn = document.getElementById('switchBtn');
  var tip = document.getElementById('switchTip');
  var tipTimer = null;

  var host = location.hostname;
  var isNew = (host === 'ordm.de5.net');
  var isOld = (host === 'ordream.pages.dev');

  // 目标：新版→旧版；旧版→新版；其他→新版
  var target = isNew ? OLD_URL : NEW_URL;
  var label  = isNew ? '旧版' : '新版';

  btn.title = '切换到' + label;
  function showTip(text){
    tip.textContent = text;
    tip.classList.add('show');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(function(){ tip.classList.remove('show'); }, 2600);
  }
  btn.addEventListener('mouseenter', function () {
    showTip((isNew ? '当前：新版' : (isOld ? '当前：旧版' : '当前：其他域名')) + ' → 去' + label);
  });

  btn.addEventListener('click', function () {
    try {
      if (isNew) {
        // 去旧版：标记停留，避免被统一跳转弹回
        sessionStorage.setItem('ordm_stay', '1');
        location.href = OLD_URL + '?stay=1';
      } else {
        sessionStorage.removeItem('ordm_stay');
        location.href = NEW_URL;
      }
    } catch (e) {
      location.href = target;
    }
  });
})();

/* ================= 背景音乐 ================= */
(function () {
  var audio    = document.getElementById('bgm');
  var btn      = document.getElementById('musicBtn');
  var tip      = document.getElementById('musicTip');
  var started  = false;
  var tipTimer = null;

  function syncUI() {
    btn.classList.toggle('playing', !audio.paused && !audio.ended);
  }

  function showTip(text, autoHide) {
    tip.textContent = text;
    tip.classList.add('show');
    clearTimeout(tipTimer);
    if (autoHide !== false) {
      tipTimer = setTimeout(function () { tip.classList.remove('show'); }, 3200);
    }
  }

  function removeOnce() {
    document.removeEventListener('click', onFirstInteract);
    document.removeEventListener('touchstart', onFirstInteract);
    document.removeEventListener('keydown', onFirstInteract);
  }

  function tryPlay() {
    audio.volume = 0.6;
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.then(function () {
        started = true;
        syncUI();
        tip.classList.remove('show');
        removeOnce();
      }).catch(function () {
        showTip('点击页面任意处即可播放音乐 ♪');
      });
    } else {
      started = true;
      syncUI();
      removeOnce();
    }
  }

  function onFirstInteract() {
    if (started) return;
    tryPlay();
  }

  document.addEventListener('click', onFirstInteract);
  document.addEventListener('touchstart', onFirstInteract);
  document.addEventListener('keydown', onFirstInteract);

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (audio.paused) {
      audio.volume = 0.6;
      audio.play().then(function () {
        started = true;
        syncUI();
        removeOnce();
        tip.classList.remove('show');
      }).catch(function () {
        showTip('音乐文件未找到，请确认 mp3 与网页在同一目录');
      });
    } else {
      audio.pause();
      syncUI();
      showTip('已暂停 ♪');
    }
  });

  btn.addEventListener('mouseenter', function () {
    if (!started) showTip('点击开启背景音乐 ♪');
  });

  audio.addEventListener('error', function () {
    showTip('未找到音乐文件：请确认 mp3 与本网页在同一目录');
  });

  audio.addEventListener('play', syncUI);
  audio.addEventListener('pause', syncUI);

  window.addEventListener('load', tryPlay);
})();
</script>
